<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose 下载中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, Segoe UI, sans-serif;
        }
        body {
            background-color: #e9e4f5;
            color: #222;
            padding: 3rem 1.5rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 4px 22px rgba(0,0,0,0.12);
        }
        h1 {
            color: #7b68d8;
            text-align: center;
            margin-bottom: 36px;
        }
        .project-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            background: #f7f5fc;
            border-radius: 12px;
        }
        .project-info h3 {
            margin: 0;
        }
        .enter-btn {
            background:#7b68d8;
            color:#fff;
            border:0;
            padding:10px 20px;
            border-radius:9px;
            font-size:16px;
            cursor:pointer;
        }
        .enter-btn:hover {
            background:#6a57c2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wildgoose 下载中心</h1>

        <div class="project-item">
            <div class="project-info">
                <h3>艺术社团展板</h3>
            </div>
            <button class="enter-btn" onclick="location.href='./infoboard.html'">进入项目</button>
        </div>
    </div>
</body>
</html>
